plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

// Сборка под конкретную версию: gradle build -Pmc=1.21.1
def mc = (project.findProperty('mc') ?: '1.21.1').toString()
def targets = [
    '1.21.1': [yarn: '1.21.1+build.3', java: 21, src: 'v1_21'],
    '1.20.1': [yarn: '1.20.1+build.10', java: 17, src: 'v1_20']
]
def cfg = targets[mc]
if (cfg == null) throw new GradleException("Неподдерживаемая версия Minecraft: ${mc}")

version = "1.0.0+${mc}"
group = 'com.kirilltan.aurora'
base { archivesName = 'aurora-helper' }

sourceSets {
    main {
        java { srcDir "src/${cfg.src}/java" }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings "net.fabricmc:yarn:${cfg.yarn}:v2"
    modImplementation 'net.fabricmc:fabric-loader:0.16.5'
}

java {
    sourceCompatibility = JavaVersion.toVersion(cfg.java)
    targetCompatibility = JavaVersion.toVersion(cfg.java)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = cfg.java
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc', mc
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'mc': mc
    }
}
