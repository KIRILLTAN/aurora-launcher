name: Самопроверка (установка и запуск Minecraft)

on:
  workflow_dispatch:

jobs:
  helper:
    uses: ./.github/workflows/helper.yml

  selftest:
    needs: helper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: helper-*
          path: resources/helper
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils imagemagick xdotool xcompmgr
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Запуск лаунчера в режиме самопроверки
        run: |
          mkdir -p selftest
          (sleep 600; DISPLAY=:99 import -window root selftest/screen-10min.png || true) &
          xvfb-run -n 99 -s "-screen 0 1600x1000x24" bash -c "xcompmgr -n & npx electron . --no-sandbox" 2>&1 | tee selftest/electron.log
        env:
          AURORA_SELFTEST: ${{ github.workspace }}/selftest
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: cat selftest/result.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest

  # Оверлей на настоящем Windows: игра в полноэкранном режиме, программный OpenGL (Mesa llvmpipe)
  selftest-windows:
    needs: helper
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: helper-*
          path: resources/helper
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Mesa (программный OpenGL для игры без видеокарты)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = gh release view -R pal1000/mesa-dist-win --json assets --jq '.assets[] | select(.name | endswith("release-msvc.7z")) | .url'
          Write-Host "Mesa: $url"
          Invoke-WebRequest $url -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          New-Item -ItemType Directory -Force gl | Out-Null
          Copy-Item mesa/x64/*.dll gl/
          Get-ChildItem gl
      - name: Запуск лаунчера в режиме самопроверки (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest | Out-Null
          npx electron . 2>&1 | Tee-Object selftest/electron.log
        env:
          AURORA_SELFTEST: ${{ github.workspace }}\selftest
          AURORA_SELFTEST_MODE: windows
          AURORA_SELFTEST_GL: ${{ github.workspace }}\gl
          GALLIUM_DRIVER: llvmpipe
      - run: Get-Content selftest/result.json
        if: always()
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: selftest
