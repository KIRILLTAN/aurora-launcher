name: Оверлей-помощник (Java-агент)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['overlay-agent/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Сборка агента (совместим с Java 8+)
        run: |
          mkdir -p overlay-agent/build out
          javac --release 8 -Xlint:-options -encoding UTF-8 -d overlay-agent/build $(find overlay-agent/src -name '*.java')
          jar cfm out/aurora-overlay.jar overlay-agent/MANIFEST.MF -C overlay-agent/build .
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: helper-agent
          path: out/*.jar
