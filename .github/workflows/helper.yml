name: Мод Aurora Helper

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['helper-mod/**']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20.1', '1.21.1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Сборка мода для ${{ matrix.mc }}
        working-directory: helper-mod
        run: gradle build -Pmc=${{ matrix.mc }} --no-daemon --stacktrace
      - name: Переименование
        run: |
          mkdir -p out
          cp helper-mod/build/libs/aurora-helper-1.0.0+${{ matrix.mc }}.jar out/aurora-helper-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.mc }}
          path: out/*.jar
